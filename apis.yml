aid: fibery
name: Fibery
description: Fibery is a connected work management platform with a REST API and GraphQL
  API for managing entities, databases, automation rules, collaborative documents,
  and custom workflow views. It supports webhooks, file uploads, rich text operations,
  and real-time change history for building integrations and automating workflows.
